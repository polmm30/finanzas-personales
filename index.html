async function save(){const e={id:'m'+Date.now(),a:W.a,k:W.k,c:W.c,n:W.n||'',d:W.d};M=[...M,e];persist();closeW();go();if(dbc)try{await dbc.doc(e.id).set(e)}catch(x){}}
function closeW(){$('#sh').innerHTML=''}
function wz(s){W.s=s;if(!W.d)W.d=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);const hd=(t)=>`<div class="r"><b style="font-size:17px">${t}</b><button class="x" onclick="closeW()">✕</button></div>`;let h='';
if(s==1)h=hd('Nuevo movimiento')+`<div class="mu" style="margin:14px 0 6px">1 · Importe (€)</div><input class="in" id="am" inputmode="decimal" placeholder="0,00" value="${W.a||''}" oninput="W.a=this.value"><button class="pb" onclick="W.a=parseFloat(String(W.a).replace(',','.'));if(!(W.a>0)){W.a='';return wz(1)}wz(2)">Siguiente</button>`;
if(s==2)h=hd(E(W.a))+`<div class="mu" style="margin:14px 0 8px">2 · ¿Qué es?</div><div class="g3">${['g','i','v'].map(k=>`<button onclick="W.k='${k}';W.c='';wz(3)">${KN[k]}</button>`).join('')}</div><button class="bk" onclick="wz(1)">‹ Cambiar importe</button>`;
if(s==3)h=hd(KN[W.k]+' · '+E(W.a))+`<div class="mu" style="margin:14px 0 8px">3 · Tipo de ${KN[W.k].toLowerCase()}</div><div class="chips" style="flex-wrap:wrap">${MC[W.k].map(c=>`<button class="${W.c==c?'on':''}" onclick="W.c=this.textContent;wz(3)">${c}</button>`).join('')}</div><input class="in s" placeholder="Nota (opcional)" value="${esc(W.n)}" oninput="W.n=this.value"><input class="in s" type="date" value="${W.d}" onchange="W.d=this.value"><button class="pb" onclick="if(!W.c||!W.d)return;save()" style="opacity:${W.c?1:.4}">Guardar</button><button class="bk" onclick="wz(2)">‹ Atrás</button>`;
$('#sh').innerHTML=`<div class="ov" onclick="if(event.target==this)closeW()"><div class="sheet">${h}</div></div>`;const i=$('#am');if(i)i.focus()}
function hs(){const h=location.hash.slice(1);if(h.startsWith('n')&&h!=hs.l){hs.l=h;W={d:''};const a=parseFloat(decodeURIComponent(h.slice(2)).replace(',','.'));if(a>0){W.a=a;wz(2)}else wz(1)}}
async function init(){try{if(typeof claude!=='undefined'){const u=await claude.use('user'),db=await claude.use('db');if(u&&db){const id=await u.id();if(id){dbc=db.collection('data/users/'+id);dbc.onSnapshot(s=>{M=s.docs.map(d=>d.data());persist();go()},()=>{})}}}}catch(e){}
if(!dbc){try{M=JSON.parse(localStorage.getItem('m')||'[]')}catch(e){}}go();hs();let k=0;const iv=setInterval(()=>{hs();if(++k>20)clearInterval(iv)},500)}
const MB=()=>M.filter(m=>m.k=='g'||m.k=='i'||m.k=='v');const PXm=()=>Object.fromEntries(M.filter(m=>m.k=='px').map(m=>[m.i,m.p]));const NMm=()=>Object.fromEntries(M.filter(m=>m.k=='nm').map(m=>[m.i,m.n]));
const fn=i=>NMm()[i]||i,N3=n=>n.toLocaleString('es-ES',{maximumFractionDigits:3}),fd=d=>d.split('-').reverse().join('/'),td=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
async function put(e){M=M.filter(m=>m.id!=e.id);M.push(e);persist();go();if(dbc)try{await dbc.doc(e.id).set(e)}catch(x){}}
function setPx(i,v){const p=parseFloat(String(v).replace(',','.'));if(p>0)put({id:'px_'+i,k:'px',i,p})}
function ren(i){const n=prompt('Nombre del fondo',NMm()[i]||'');if(n!==null)put({id:'nm_'+i,k:'nm',i,n:n.trim()})}
function xirr(f){f=[...f].sort((a,b)=>a.d.localeCompare(b.d));const t0=new Date(f[0].d);const y=f.map(x=>[(new Date(x.d)-t0)/864e5/365,x.a]);const v=r=>y.reduce((s,[t,a])=>s+a/Math.pow(1+r,t),0);let lo=-.99,hi=10;if(v(lo)*v(hi)>0)return null;for(let i=0;i<100;i++){const m=(lo+hi)/2;v(m)*v(lo)>0?lo=m:hi=m}return(lo+hi)/2}
function pos(){const px=PXm(),o={};P.pos.forEach(p=>o[p.isin]={...p});M.filter(m=>m.k=='c').forEach(b=>{const p=o[b.i]||(o[b.i]={isin:b.i,sh:0,cost:0,lp:b.p,ld:b.d});p.sh+=b.sh;p.cost+=b.a;if(b.d>=p.ld){p.lp=b.p;p.ld=b.d}});return Object.values(o).map(p=>{const pr=px[p.isin]||p.lp;return{...p,pr,own:!!px[p.isin],v:p.sh*pr}})}
function car(){const ps=pos(),op=ps.filter(p=>p.sh>.0005).sort((a,b)=>b.v-a.v),cl=ps.filter(p=>p.sh<=.0005),C=sum(op.map(p=>p.cost)),V=sum(op.map(p=>p.v)),G=V-C,bs=M.filter(m=>m.k=='c').sort((a,b)=>b.d.localeCompare(a.d));
const fl=[...P.flows,...bs.map(b=>({d:b.d,a:-b.a})),{d:td(),a:V}],xr=xirr(fl),rl=sum(P.real.map(r=>r.g));const pc=(g,c)=>c>0?(g>=0?'+':'−')+(Math.abs(g/c)*100).toFixed(1).replace('.',',')+' %':'—';
return `<div class="c"><div class="mu">Valor estimado de la cartera</div><div class="big">${E(V)}</div><div class="r mu" style="margin-top:6px"><span>Coste ${E(C)}</span><span class="b ${G>=0?'ok':'ko'}">${sg(G)} · ${pc(G,C)}</span></div><div class="r mu"><span>Rentabilidad anualizada (TIR)</span><span class="b">${xr==null?'—':(xr*100).toFixed(1).replace('.',',')+' %'}</span></div>${rl?`<div class="r mu"><span>Ya cobrado en la venta del ${fd(P.real[0].d)}</span><span class="b ok">${sg(rl)}</span></div>`:''}</div>
<button class="pb" style="margin:0 0 12px" onclick="C={d:td()};cw(1)">+ Añadir compra de fondo</button>
<div class="c"><h2>Posiciones</h2><div class="mu">Toca el nombre para ponerle uno (el archivo solo trae el ISIN). El precio sale del último pedido (importe ÷ participaciones): es una estimación; cámbialo por el valor liquidativo real.</div>${op.map(p=>`<div class="row"><div class="r"><b onclick="ren('${p.isin}')" style="cursor:pointer">${esc(fn(p.isin))} ✎</b><span class="b ${p.v>=p.cost?'ok':'ko'}">${pc(p.v-p.cost,p.cost)}</span></div><div class="mu">${p.isin} · ${N3(p.sh)} part. · coste ${E(p.cost)} · valor ${E(p.v)}</div><div class="r mu"><span>Precio ${p.own?'(tuyo)':'(estimado '+fd(p.ld)+')'}</span><input type="text" inputmode="decimal" value="${p.pr.toFixed(4).replace('.',',')}" onchange="setPx('${p.isin}',this.value)" style="width:100px;text-align:right;font:inherit;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:4px 8px"></div></div>`).join('')}</div>
${bs.length?`<div class="c"><h2>Mis compras añadidas</h2>${bs.map(b=>`<div class="row"><div class="r"><span class="b">${esc(fn(b.i))}</span><span class="b">${E(b.a)}</span></div><div class="r mu"><span>${fd(b.d)} · ${N3(b.sh)} part. a ${b.p.toFixed(4).replace('.',',')} €</span><button onclick="del('${b.id}')" style="border:0;background:none;color:var(--ko);font:inherit">Borrar</button></div></div>`).join('')}</div>`:''}
<div class="c"><h2>Traspasos emparejados (${P.tr.length})</h2><div class="mu">Cada venta se une con la compra que paga, por importe y fecha. El coste (y la ganancia pendiente) pasa de un fondo al otro, no se reinicia.</div>${P.tr.map(t=>`<div class="row"><div class="r"><span class="b">${esc(fn(t.si))} → ${esc(fn(t.bi))}</span>${t.rev?'<span class="tag">REVISAR</span>':''}</div><div class="mu">Venta ${fd(t.sd)}: ${E(t.sa)} · compra ${fd(t.bd)}: ${E(t.ba)} · diferencia ${sg(t.diff)} (${String(t.pct).replace('.',',')} %)</div></div>`).join('')}</div>
${cl.length?`<div class="c"><h2>Fondos ya sin participaciones</h2><div class="mu">${cl.map(p=>esc(fn(p.isin))).join(' · ')}</div></div>`:''}
<div class="c"><details><summary class="b">Todas las órdenes (${P.ev.length})</summary>${[...P.ev].reverse().map(o=>`<div class="row"><div class="r"><span class="b">${esc(fn(o.isin))}</span><span class="b">${E(o.a)}</span></div><div class="mu">${fd(o.d)} · ${o.t} · ${N3(o.sh)} part.</div></div>`).join('')}</details></div>
<div class="note">Solo uso el archivo de MyInvestor: los importes son «importe estimado», sin nombres ni valor actual real, así que la rentabilidad es aproximada. Dejé fuera ${P.ign.length} órdenes canceladas o rechazadas. ${P.tr.filter(t=>t.rev).length} traspasos con diferencia grande o pareja dudosa están marcados REVISAR.</div>`}
function cw(s){C.s=s;const hd=t=>`<div class="r"><b style="font-size:17px">${t}</b><button class="x" onclick="closeW()">✕</button></div>`;let h='';const ids=[...new Set([...P.pos.map(p=>p.isin),...M.filter(m=>m.k=='c').map(m=>m.i)])];
if(s==1)h=hd('Nueva compra de fondo')+`<div class="mu" style="margin:14px 0 8px">1 · ¿Qué fondo?</div><div class="chips" style="flex-wrap:wrap">${ids.map(i=>`<button class="${C.i==i?'on':''}" onclick="C.i='${i}';cw(2)">${esc(fn(i))}</button>`).join('')}</div><input class="in s" placeholder="u otro ISIN" oninput="C.o=this.value.trim().toUpperCase()"><button class="pb" onclick="if(C.o){C.i=C.o;cw(2)}" style="background:var(--br2)">Usar este ISIN</button>`;
if(s==2)h=hd(esc(fn(C.i)))+`<div class="mu" style="margin:14px 0 6px">2 · Importe invertido (€)</div><input class="in" id="am" inputmode="decimal" placeholder="0,00" value="${C.a||''}" oninput="C.a=this.value"><button class="pb" onclick="C.a=parseFloat(String(C.a).replace(',','.'));if(!(C.a>0)){C.a='';return cw(2)}cw(3)">Siguiente</button><button class="bk" onclick="cw(1)">‹ Atrás</button>`;
if(s==3){const sh=C.p>0?C.a/C.p:0;h=hd(esc(fn(C.i))+' · '+E(C.a))+`<div class="mu" style="margin:14px 0 6px">3 · Valor liquidativo al que compraste (€ por participación)</div><input class="in" id="am" inputmode="decimal" placeholder="0,0000" value="${C.q||''}" oninput="C.q=this.value;C.p=parseFloat(this.value.replace(',','.'));document.getElementById('sp').textContent=C.p>0?'≈ '+N3(C.a/C.p)+' participaciones':''"><div class="mu" id="sp" style="margin-top:6px">${sh?'≈ '+N3(sh)+' participaciones':''}</div><input class="in s" type="date" value="${C.d}" onchange="C.d=this.value"><button class="pb" onclick="if(!(C.p>0)||!C.d)return;put({id:'c'+Date.now(),k:'c',i:C.i,a:C.a,p:C.p,sh:C.a/C.p,d:C.d});closeW()">Guardar</button><button class="bk" onclick="cw(2)">‹ Atrás</button>`}
$('#sh').innerHTML=`<div class="ov" onclick="if(event.target==this)closeW()"><div class="sheet">${h}</div></div>`;const i=$('#am');if(i)i.focus()}
let C={};
function go(){prep();const f={res,gas,fij,ale,hor,car,sim:simu,mov,rev}[tab];$('#nav').innerHTML=T.map(t=>`<button class="${t[0]==tab?'on':''}" onclick="tab='${t[0]}';go();scrollTo(0,0)">${t[1]}</button>`).join('');
let h=f();if(tab=='sim'){const all=[...D.rec,...D.hor];const m=sum(all.filter(x=>sim[x.id]).map(x=>x.m));h+=`<div class="sim"><div><div style="opacity:.8;font-size:12px">Ahorrarías al mes</div><b style="font-size:22px">${E(m)}</b></div><div style="text-align:right"><div style="opacity:.8;font-size:12px">Al año</div><b style="font-size:22px">${E(m*12)}</b></div></div>`}$('#m').innerHTML=h+`<button class="fab ${tab=='sim'?'up':''}" onclick="W={d:''};wz(1)">+</button>`}
const $=s=>document.querySelector(s);init();addEventListener('hashchange',hs);
</script></body></html>
